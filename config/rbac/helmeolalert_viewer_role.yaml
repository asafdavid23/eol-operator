# This rule is not used by the project eol-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to helm.earnix.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: eol-operator
    app.kubernetes.io/managed-by: kustomize
  name: helmeolalert-viewer-role
rules:
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts/status
  verbs:
  - get
