# This rule is not used by the project eol-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the helm.earnix.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: eol-operator
    app.kubernetes.io/managed-by: kustomize
  name: helmeolalert-editor-role
rules:
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts/status
  verbs:
  - get
