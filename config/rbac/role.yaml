---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts/finalizers
  verbs:
  - update
- apiGroups:
  - helm.earnix.com
  resources:
  - helmeolalerts/status
  verbs:
  - get
  - patch
  - update
